<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Propiedades</title><link rel="stylesheet" href="../styles.css" /></head>
  <body>
    <nav class="proto-nav"><a href="../index.html">Volver al índice</a></nav>
    <header class="navbar"><div class="navbar__logo"><strong>Hogar</strong>360</div><div class="navbar__right"><span>Bienvenido, Seller</span></div></header>
    <div class="app-layout">
      <aside class="sidebar"><ul><li>Dashboard</li><li>Categorías</li><li>Ubicaciones</li><li class="active">Propiedades</li><li>Visitas</li></ul></aside>
      <main class="content">
        <h1 class="page-title">Publicar casa</h1>
        <section class="card form-grid" style="margin-bottom:24px;">
          <div class="field"><label>Nombre</label><input value="Casa en la playa" /></div>
          <div class="field"><label>Descripción</label><textarea>Casa amplia, iluminada y cerca al mar.</textarea></div>
          <div class="field"><label>Categoría</label><select><option>Casa</option></select></div>
          <div class="field"><label>Habitaciones</label><input type="number" value="4" /></div>
          <div class="field"><label>Baños</label><input type="number" value="3" /></div>
          <div class="field"><label>Precio</label><input type="number" value="480000000" /></div>
          <div class="actions"><button class="btn" type="button">Publicar</button></div>
        </section>
        <h2 class="page-subtitle">Casas Existentes</h2>
        <div class="table-wrap">
          <table><thead><tr><th>ID</th><th>Nombre</th><th>Ubicación</th><th>Habitaciones</th><th>Baños</th><th>Precio</th></tr></thead><tbody><tr><td>31</td><td>Casa Campestre Aurora</td><td>Medellín</td><td>4</td><td>3</td><td>$480,000,000</td></tr><tr><td>32</td><td>Apto Vista Norte</td><td>Bogotá</td><td>3</td><td>2</td><td>$320,000,000</td></tr></tbody></table>
        </div>
        <div class="pagination"><button>&lt;</button><button class="active">1</button><button>2</button><button>&gt;</button></div>
      </main>
    </div>
