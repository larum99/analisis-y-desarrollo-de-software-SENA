<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Prototipo</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <nav class="proto-nav"><a href="../index.html">Volver al índice</a></nav>
    <section class="login-page">
      <div class="login-illustration">
        <img src="../../src/assets/images/undraw_house-searching_g2b8.svg" alt="Ilustración login" />
      </div>
      <div class="login-form-wrap">
        <form class="card login-card form-grid">
          <h2 style="text-align:center;color:#2563eb;margin:0;">Iniciar sesión</h2>
          <div class="field">
            <label>Correo electrónico</label>
            <input type="email" placeholder="Correo electrónico" value="seller@hogar360.com" />
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" placeholder="Contraseña" value="123456789" />
          </div>
          <div class="actions"><button class="btn" type="button">Iniciar sesión</button></div>
        </form>
      </div>
    </section>
  </body>
</html>
